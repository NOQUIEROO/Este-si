<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PongBrain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Estudio crema: el aparato solo, sin texto. Se maneja tocándolo. */
:root { --studio: #d9d2c3; --ink: #3a3328; color-scheme: light; }
html, body { height: 100%; margin: 0; }
body { background: var(--studio); overflow: hidden; font: 600 13px/1.4 ui-monospace, Menlo, monospace; color: var(--ink); }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#bar { position: fixed; left: 50%; top: 50%; width: 160px; height: 3px; margin-left: -80px; background: rgba(58, 51, 40, 0.15); border-radius: 2px; overflow: hidden; }
#bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 0.2s; }
#bar[hidden], #err[hidden] { display: none; }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #7a1c0c; }
</style>

<canvas id="view" aria-label="PongBrain. Tocá la pantalla para deslizarla, la botonera para correrla y la llave de la derecha para cambiar la condición. Arrastrá para girar."></canvas>
<div id="bar"><i></i></div>
<div id="err" hidden></div>

<script>
  // si algo falla, decirlo en vez de quedar en blanco
  (function () {
    function show(msg) { var el = document.getElementById('err'); el.hidden = false; el.textContent = 'No se pudo mostrar el aparato: ' + msg; document.getElementById('bar').hidden = true; }
    window.__showError = show;
    window.addEventListener('error', function (e) { if (e.target && e.target !== window) return show('no cargó ' + (e.target.src || e.target.href || '')); show(e.message || 'error'); }, true);
    window.addEventListener('unhandledrejection', function (e) { show((e.reason && (e.reason.message || e.reason)) + ''); });
  })();
</script>

async function loadModel() {

    const res = await fetch('pongbrain.gltf.json'); if (!res.ok) throw new Error('no cargó el modelo');
    const total = +res.headers.get('content-length') || 3.8e6, reader = res.body.getReader(), chunks = []; let got = 0;

    text = new TextDecoder().decode(await new Blob(chunks).arrayBuffer());

  const j = JSON.parse(text);
  const b64 = j.buffers[0].uri.split(',')[1]; delete j.buffers[0].uri;
  const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const pad = (n) => (4 - (n % 4)) % 4;
  const jsonBytes = new TextEncoder().encode(JSON.stringify(j));

  const size = 12 + 8 + jsonBytes.length + jp + 8 + bin.length + bp;
  const glb = new ArrayBuffer(size), dv = new DataView(glb), u8 = new Uint8Array(glb);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, size, true);

const root = gltf.scene; scene.add(root);
const san = (n) => THREE.PropertyBinding.sanitizeNodeName(n);

// ---------- placa: tu silicio verde con electrodos grises, y el tejido del cultivo encima
const PXA = -34.6, PXB = 34.6, PYA = -69.0, PYB = 37.9;
function dataTex(w, h, format, data) {

}

const area = new THREE.Vector4(PXA, PXB, PYA, PYB);

const plateMat = new THREE.ShaderMaterial({
  uniforms: { tField: { value: fieldTex }, tAct: { value: actTex }, area: { value: area } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `
    uniform sampler2D tField, tAct; uniform vec4 area; varying vec3 vW;
    ${UV}
    void main(){
      float xm = vW.x * 1000.0, ym = -vW.z * 1000.0;
      vec2 uv = uvOf(vW);
      // grilla de electrodos: cuadrados de 0,3 mm cada 0,78 mm (como en tu Blender)
      vec2 g = fract(vec2(xm, ym) / 0.78);
      vec2 aa = fwidth(vec2(xm, ym) / 0.78) * 0.8;
      float e = (smoothstep(0.0, aa.x, g.x) - smoothstep(0.385, 0.385 + aa.x, g.x)) * (smoothstep(0.0, aa.y, g.y) - smoothstep(0.385, 0.385 + aa.y, g.y));
      e = mix(e, 0.385 * 0.385, clamp(max(aa.x, aa.y) * 2.0 - 0.5, 0.0, 1.0));   // de lejos, el promedio (sin muaré)
      vec3 base = mix(vec3(0.02, 0.121, 0.003), vec3(0.314), clamp(e, 0.0, 1.0));
      // serigrafía en el chip: la cancha y las zonas SUBE / BAJA
      float lw = 0.12 + fwidth(ym) * 0.8, mark = 0.0;
      mark = max(mark, (1.0 - smoothstep(0.0, lw, abs(ym + 45.8))) * step(abs(xm), 34.6));
      mark = max(mark, (1.0 - smoothstep(0.0, lw, abs(ym - 37.9))) * step(abs(xm), 34.6));
      float inWin = step(-67.5, ym) * step(ym, -52.5) * step(abs(xm), 33.8);
      mark = max(mark, (1.0 - smoothstep(0.0, lw, abs(ym + 67.5))) * step(abs(xm), 33.8));
      mark = max(mark, (1.0 - smoothstep(0.0, lw, abs(ym + 52.5))) * step(abs(xm), 33.8));
      mark = max(mark, (1.0 - smoothstep(0.0, lw, abs(abs(xm) - 33.8))) * step(-67.5, ym) * step(ym, -52.5));

      mark = max(mark, (1.0 - smoothstep(0.0, lw, abs(ym + 4.2))) * step(abs(xm), 34.6) * step(0.5, fract(xm / 2.0)));

      float fw = texture2D(tField, uv).r;
      float thin = smoothstep(0.06, 0.2, fw) * (1.0 - smoothstep(0.38, 0.45, fw));   // axones finos entre grupos
      base = mix(base, vec3(0.22, 0.12, 0.02), thin * 0.35);
      vec3 col = base + vec3(0.25, 0.85, 1.0) * texture2D(tAct, uv).b * 0.9;          // celeste: electrodo estimulando
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const TH = 0.45, HMAX = 0.0011;
const tissueMat = new THREE.ShaderMaterial({
  uniforms: { tField: { value: fieldTex }, tHeight: { value: heightTex }, tAct: { value: actTex }, area: { value: area }, th: { value: TH }, hmax: { value: HMAX },
              light: { value: new THREE.Vector3(-0.5, 0.8, 0.35).normalize() } },
  vertexShader: `
    uniform sampler2D tField, tHeight; uniform vec4 area; uniform float th, hmax;
    varying vec3 vW; varying vec2 vUv; varying float vF;
    ${UV}
    void main(){

      float hf = texture2D(tHeight, vUv).r;                       // altura suavizada: lomos redondeados, no picos

    }`,
  fragmentShader: `
    uniform sampler2D tAct; uniform float th; uniform vec3 light;
    varying vec3 vW; varying vec2 vUv; varying float vF;
    void main(){

      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,

{

// ---------- cuadro a cuadro: solo dibuja lo que manda el cultivo
